name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build (vYYYY.M.D.N or vYYYY.M.D.N-beta)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      channel: ${{ steps.tag.outputs.channel }}
      prerelease: ${{ steps.tag.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve tag
        id: tag
        uses: RealWhyKnot/workflows/resolve-tag@v1
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          tag-pattern: '^v\d{4}\.\d+\.\d+\.\d+(-beta)?$'

      - name: Validate release version sequence
        uses: RealWhyKnot/workflows/version-sequence@v1
        with:
          tag: ${{ steps.tag.outputs.tag }}

  build:
    name: Build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            target: x86_64-pc-windows-msvc
            ext: zip
            exe: heartwire.exe
            test: true
          - os: ubuntu-latest
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            ext: tar.gz
            exe: heartwire
            test: true
          - os: macos-latest
            rid: osx-arm64
            target: aarch64-apple-darwin
            ext: tar.gz
            exe: heartwire
            test: true
          - os: macos-latest
            rid: osx-x64
            target: x86_64-apple-darwin
            ext: tar.gz
            exe: heartwire
            test: false
    env:
      HEARTWIRE_VERSION: ${{ needs.validate.outputs.version }}
      HEARTWIRE_CHANNEL: ${{ needs.validate.outputs.channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libdbus-1-dev libssl-dev libfontconfig1-dev libxkbcommon-dev

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ matrix.rid }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-release-${{ matrix.rid }}-

      - name: Test
        if: matrix.test
        run: cargo test --locked --release --target ${{ matrix.target }}

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        run: |
          $version = $env:HEARTWIRE_VERSION
          $name = "heartwire-$version-${{ matrix.rid }}"
          $stage = Join-Path 'dist' $name
          New-Item -ItemType Directory -Force (Join-Path $stage 'firmware') | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.exe }}" $stage
          Copy-Item README.md, LICENSE, NOTICE.md $stage
          Copy-Item firmware/main.py, firmware/hr_config.example.py (Join-Path $stage 'firmware')
          if ('${{ matrix.ext }}' -eq 'zip') {
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip" -Force
          } else {
            tar -czf "dist/$name.tar.gz" -C $stage .
            if ($LASTEXITCODE -ne 0) { throw "tar failed ($LASTEXITCODE)" }
          }

      - name: Checksums
        uses: RealWhyKnot/workflows/checksums@v1
        with:
          archives: dist/*.${{ matrix.ext }}

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            dist/*.${{ matrix.ext }}
            dist/*.integrity.tsv
          retention-days: 3

  publish:
    name: Publish ${{ needs.validate.outputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [validate, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ needs.validate.outputs.tag }}

      - name: Download builds
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Hash table
        id: checksums
        uses: RealWhyKnot/workflows/checksums@v1
        with:
          archives: |
            dist/*.zip
            dist/*.tar.gz
          manifest: 'false'

      - name: Build release notes
        id: notes
        uses: RealWhyKnot/workflows/release-notes@v1
        with:
          tag: ${{ needs.validate.outputs.tag }}
          title: Heartwire ${{ needs.validate.outputs.tag }}
          extra: |
            ## Downloads

            - Windows: `heartwire-${{ needs.validate.outputs.version }}-win-x64.zip`
            - Linux: `heartwire-${{ needs.validate.outputs.version }}-linux-x64.tar.gz`
            - macOS: `heartwire-${{ needs.validate.outputs.version }}-osx-arm64.tar.gz` (Apple silicon) or `-osx-x64.tar.gz` (Intel)

            Each archive has a matching `.integrity.tsv` with the hash of the archive and every file in it.

            ${{ steps.checksums.outputs.table }}

      - name: Publish
        uses: RealWhyKnot/workflows/publish-release@v1
        with:
          tag: ${{ needs.validate.outputs.tag }}
          title: Heartwire ${{ needs.validate.outputs.tag }}
          notes-file: ${{ steps.notes.outputs.file }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          draft-first: 'true'
          assets: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.integrity.tsv
