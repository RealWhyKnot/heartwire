name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libdbus-1-dev libssl-dev libfontconfig1-dev libxkbcommon-dev

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-ci-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-ci-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $want = 'v3.12'
          $have = ''
          $exe = 'C:\Program Files (x86)\NSIS\makensis.exe'
          if (Test-Path -LiteralPath $exe) { $have = (& $exe /VERSION) }
          if ($have -ne $want) {
            choco install nsis --version 3.12.0 --force -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "choco install nsis failed ($LASTEXITCODE)" }
          }

      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed ($LASTEXITCODE)" }
          $payload = 'dist/payload'
          New-Item -ItemType Directory -Force (Join-Path $payload 'firmware') | Out-Null
          Copy-Item target/debug/heartwire.exe, README.md, LICENSE, NOTICE.md $payload
          Copy-Item firmware/main.py, firmware/hr_config.example.py (Join-Path $payload 'firmware')
          ./installer/build.ps1 -Payload $payload -Version 0.0.0.0-CI -OutFile dist/heartwire-setup.exe
          ./installer/test.ps1 -Setup dist/heartwire-setup.exe -Payload $payload -Version 0.0.0.0-CI

      - name: Check the firmware
        if: runner.os == 'Linux'
        run: python3 -m py_compile firmware/main.py firmware/hr_config.example.py
