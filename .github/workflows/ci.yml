name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
    uses: RealWhyKnot/workflows/.github/workflows/repo-checks.yml@v1

  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libdbus-1-dev libssl-dev libfontconfig1-dev libxkbcommon-dev

      - name: Set up Rust
        uses: RealWhyKnot/workflows/setup-rust@v1
        with:
          toolchain: stable
          components: rustfmt, clippy
          cache-key: cargo-ci

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Install NSIS
        if: runner.os == 'Windows'
        uses: RealWhyKnot/workflows/setup-nsis@v1
        with:
          version: '3.12'

      - name: Installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --locked
          if ($LASTEXITCODE -ne 0) { throw "cargo build failed ($LASTEXITCODE)" }
          $payload = 'dist/payload'
          New-Item -ItemType Directory -Force (Join-Path $payload 'firmware') | Out-Null
          Copy-Item target/debug/heartwire.exe, README.md, LICENSE, NOTICE.md $payload
          Copy-Item firmware/main.py, firmware/hr_config.example.py (Join-Path $payload 'firmware')
          ./installer/build.ps1 -Payload $payload -Version 0.0.0.0-CI -OutFile dist/heartwire-setup.exe
          ./installer/test.ps1 -Setup dist/heartwire-setup.exe -Payload $payload -Version 0.0.0.0-CI

      - name: Check the firmware
        if: runner.os == 'Linux'
        run: python3 -m py_compile firmware/main.py firmware/hr_config.example.py
