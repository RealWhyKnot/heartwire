[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"

[licenses]
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MPL-2.0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "IJG",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[[licenses.exceptions]]
crate = "i-slint-backend-selector"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-backend-winit"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-common"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-compiler"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-core"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-core-macros"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-renderer-skia"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "i-slint-renderer-software"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "slint"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "slint-build"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
crate = "slint-macros"
allow = ["GPL-3.0-only"]
