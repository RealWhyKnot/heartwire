[package]
name = "heartwire"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
description = "Heart rate to VRChat over OSC from Bluetooth straps, a Pico bridge, HTTP or Pulsoid"
license = "GPL-3.0-or-later"
repository = "https://github.com/RealWhyKnot/heartwire"
publish = false

[dependencies]
heartwire-ui = { path = "crates/heartwire-ui" }
slint.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
btleplug.workspace = true
tokio.workspace = true
futures.workspace = true
uuid.workspace = true
ureq.workspace = true
tungstenite.workspace = true
sha2.workspace = true
bytemuck.workspace = true
num-traits.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
serialport = { workspace = true, default-features = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = { workspace = true }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
i-slint-backend-testing = { workspace = true }
png = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_HiDpi"] }

[workspace]
members = ["crates/heartwire-ui"]
resolver = "3"

[workspace.dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "unstable-winit-030"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10", default-features = false }
btleplug = "0.13"
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros"] }
futures = { version = "0.3", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false }
ureq = { version = "3.4", default-features = false, features = ["native-tls"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
sha2 = "0.11"
bytemuck = "1"
num-traits = "0.2.19"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
slint-build = "1.18"
winresource = "0.1"
i-slint-backend-testing = "=1.18.1"
png = "0.18.1"

[lints]
workspace = true

[workspace.lints.rust]
unknown_lints = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
unnecessary_safety_comment = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
self_named_module_files = "deny"
ref_option = "deny"
needless_pass_by_value = "deny"
fn_params_excessive_bools = "deny"
clone_on_ref_ptr = "deny"
redundant_clone = "deny"
match_wildcard_for_single_variants = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
as_conversions = "deny"
map_err_ignore = "deny"
format_push_string = "deny"
needless_collect = "deny"
significant_drop_tightening = "deny"
manual_assert_eq = "deny"
assert_is_empty = "deny"
print_stdout = "deny"
print_stderr = "deny"
